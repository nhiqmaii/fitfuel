<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitFuel — Your Health Dashboard</title>
  <meta name="theme-color" content="#4ade80" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">FF</span>
      <h1>FitFuel</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="nutrition">Nutrition</button>
      <button class="tab" data-view="workouts">Workouts</button>
      <button class="tab" data-view="water">Water</button>
      <button class="tab" data-view="progress">Progress</button>
      <button class="tab" data-view="insights">Insights</button>
      <button class="tab" data-view="ask">Ask</button>
      <button class="tab" data-view="privacy">Privacy</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="app" class="app-main">
    <!-- Views render here -->
  </main>

  <footer class="app-footer">
    <span>Built by Greyson · data stays in your browser</span>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/workouts.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/sampleData.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/askData.js"></script>
  <script src="js/privacy.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register service worker (progressive enhancement: HTTPS or localhost only).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
